<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>5W1Hゲーム</title>
  <link rel="stylesheet" href="/games/5w1h/style.css">
  <script src="/games/5w1h/sentence.js" defer></script>
  <script src="/games/5w1h/app.js" defer></script>
</head>
<body>
  <main>
    <h1>5W1Hゲーム</h1>
    <p class="lead">いつ、どこで、だれが、なぜ、どうやって、なにをした。6つの部分をランダムに組み合わせた文を引きます。</p>

    <button type="button" id="draw" class="primary">引く</button>

    <p id="placeholder" class="placeholder">「引く」を押すと、ここに文が出ます</p>
    <p id="sentence" class="sentence" aria-live="polite" hidden></p>
    <p id="hint" class="hint" hidden>
      <span class="hint-hover">部分にカーソルを合わせると、名前が出ます。</span>
      <span class="hint-touch">部分をタップすると、名前が出ます。</span>
    </p>

    <div id="actions" class="actions" hidden>
      <button type="button" id="like" aria-pressed="false">いいね</button>
      <button type="button" id="report-open" class="quiet">通報…</button>
    </div>

    <div id="report" class="report" hidden>
      <p>不適切な部分を1つ選んでください。</p>
      <ul id="report-parts"></ul>
      <button type="button" id="report-cancel">やめる</button>
    </div>

    <p id="message" class="message" role="status"></p>

    <p class="nav"><a href="/games/5w1h/ranking/">ランキングを見る</a></p>
  </main>
  <footer>
    <a href="https://ntaaaaaaaaai.com/">ntaaaaaaaaai.com</a>
  </footer>
</body>
</html>
